syntax = "proto3";

package tenxo.v1;

option go_package = "github.com/tenxo/tenxo-v2/shared/go/genproto;genproto";
option python_package = "tenxo.v1";

message Plan {
  string framework = 1;
  string model = 2;
  string task = 3;
  string dataset = 4;
  int32 gpu_count = 5;
  string recommended_gpu = 6;
  string estimated_runtime = 7;
  double estimated_cost = 8;
  string deployment = 9;
  int32 confidence = 10;
  Requirements requirements = 11;
  repeated AlternativePlan alternatives = 12;
  map<string, string> metadata = 13;
}

message Requirements {
  double vram_gb = 1;
  double storage_gb = 2;
  double network_gbps = 3;
  map<string, string> env = 4;
}

message AlternativePlan {
  Plan plan = 1;
  string reason = 2;
  double score = 3;
}

message Estimate {
  Plan plan = 1;
  double min_cost = 2;
  double max_cost = 3;
  double avg_cost = 4;
  string min_runtime = 5;
  string max_runtime = 6;
  string avg_runtime = 7;
  double failure_risk = 8;
  int32 confidence = 9;
  repeated GPUOption gpu_options = 10;
}

message GPUOption {
  string gpu_model = 1;
  int32 count = 2;
  double hourly_rate = 3;
  double estimated_cost = 4;
  string estimated_runtime = 5;
  double vram_gb = 6;
  double reliability_score = 7;
}

message NodeInfo {
  string node_id = 1;
  string provider_id = 2;
  string gpu_model = 3;
  int32 gpu_count = 4;
  int32 vram_mb = 5;
  string status = 6;
  double hourly_rate = 7;
  Benchmark benchmark = 8;
  NetworkInfo network = 9;
  bool tee_attested = 10;
  string tee_type = 11;
  double reliability_score = 12;
  double energy_efficiency = 13;
  int64 last_seen = 14;
}

message Benchmark {
  double tflops = 1;
  double memory_bandwidth_gbps = 2;
  double latency_ms = 3;
  int64 timestamp = 4;
}

message NetworkInfo {
  string region = 1;
  string zone = 2;
  double bandwidth_gbps = 3;
  double latency_ms = 4;
}

message Deployment {
  string deployment_id = 1;
  string job_id = 2;
  repeated string target_nodes = 3;
  Artifacts artifacts = 4;
  K8sManifests k8s_manifests = 5;
  ComposeConfig compose_config = 6;
  TEEConfig tee_config = 7;
}

message Artifacts {
  string dockerfile = 1;
  string entrypoint = 2;
  map<string, string> files = 3;
}

message K8sManifests {
  string job_yaml = 1;
  string service_yaml = 2;
  string pvc_yaml = 3;
  string secret_yaml = 4;
  string configmap_yaml = 5;
}

message ComposeConfig {
  string compose_yaml = 1;
  string env_file = 2;
}

message TEEConfig {
  bool enabled = 1;
  string type = 2;  // SEV_SNP, TDX, CCA
  string quote = 3;
  string policy = 4;
}

message Job {
  string job_id = 1;
  string user_id = 2;
  string org_id = 3;
  Plan plan = 4;
  string status = 5;
  Deployment deployment = 6;
  string created_at = 7;
  string started_at = 8;
  string completed_at = 9;
  string error = 10;
  double actual_cost = 11;
  string actual_runtime = 12;
  Metrics metrics = 13;
}

message Metrics {
  double gpu_utilization = 1;
  double vram_utilization = 2;
  double cpu_utilization = 3;
  double memory_utilization = 4.
  double network_rx_mbps = 5;
  double network_tx_mbps = 6;
  double throughput = 7;
  int64 timestamp = 8;
}

message JobEvent {
  string event_id = 1;
  string job_id = 2;
  string type = 3;
  string message = 4.
  map<string, string> data = 5;
  int64 timestamp = 6;
}

message ChatMessage {
  string message_id = 1;
  string session_id = 2;
  string role = 3;  // user, assistant, tool
  string content = 4;
  map<string, string> tool_calls = 5;
  int64 timestamp = 6;
}

message ScheduleRequest {
  Plan plan = 1;
  repeated string preferred_nodes = 2;
  Constraints constraints = 3;
}

message Constraints {
  double max_cost = 1;
  string max_runtime = 2;
  repeated string required_gpus = 3;
  bool tee_required = 4;
  string region = 5;
  string zone = 5;
}

message ScheduleResponse {
  string deployment_id = 1;
  repeated string selected_nodes = 2.
  double estimated_cost = 3;
  string estimated_runtime = 4.
  double confidence = 5.
  map<string, double> scores = 6.
}

service PlannerService {
  rpc CreatePlan(CreatePlanRequest) returns (Plan);
  rpc RefinePlan(RefinePlanRequest) returns (Plan);
  rpc GetAlternatives(GetAlternativesRequest) returns (repeated AlternativePlan);
}

service ComputePlannerService {
  rpc Estimate(EstimateRequest) returns (Estimate);
  rpc CompareGPUs(CompareGPUsRequest) returns (repeated GPUOption);
}

service SchedulerService {
  rpc Schedule(ScheduleRequest) returns (ScheduleResponse);
  rpc Reschedule(RescheduleRequest) returns (ScheduleResponse);
  rpc GetNodeScores(GetNodeScoresRequest) returns (repeated NodeScore);
}

service DeploymentService {
  rpc GenerateArtifacts(GenerateArtifactsRequest) returns (Deployment);
  rpc ValidateArtifacts(ValidateArtifactsRequest) returns (ValidationResult);
}

service MonitoringService {
  rpc GetJobMetrics(GetJobMetricsRequest) returns (stream Metrics);
  rpc GetNodeMetrics(GetNodeMetricsRequest) returns (stream NodeMetrics);
  rpc GetClusterMetrics(GetClusterMetricsRequest) returns (ClusterMetrics);
}

service BillingService {
  rpc GetUsage(GetUsageRequest) returns (Usage);
  rpc GetEstimate(GetEstimateRequest) returns (CostEstimate);
  rpc CreateBudget(CreateBudgetRequest) returns (Budget);
}