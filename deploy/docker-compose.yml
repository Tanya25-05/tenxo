# Deploy the full Tenxo stack on a single VM / VPS.
# Usage: docker compose -f deploy/docker-compose.yml up -d
#
# Requires:
#   - Docker 24+ with Compose plugin
#   - NVIDIA Container Toolkit (for GPU edge agent - optional on control plane)

version: "3.9"

services:
  # ─── Infrastructure ──────────────────────────────────────────────────────
  nats:
    image: nats:2.10.3
    # NATS ports are internal (matchmaker connects via Docker DNS nats:4222).
    # Do not expose publicly — HTTP requests to NATS port cause parser errors.
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - ../backend/configs/nats.conf:/etc/nats/nats-server.conf:ro
      - nats-data:/data
    command: ["-c", "/etc/nats/nats-server.conf"]
    restart: unless-stopped
    networks:
      - tenxo-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - tenxo-net

  # ─── Matchmaker (Go Backend) ─────────────────────────────────────────────
  matchmaker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      API_ADDR: ":8080"
      PUBLIC_API_URL: "https://api.tenxo.ai"           # Change to your domain
      NATS_URL: "nats://nats:4222"
      REDIS_ADDR: "redis:6379"
      NATS_STREAM: "JOB_STREAM"
      SUPABASE_JWKS_URL: "${SUPABASE_JWKS_URL}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY}"
      R2_ACCOUNT_ID: "${R2_ACCOUNT_ID}"
      R2_BUCKET: "${R2_BUCKET}"
      UPLOADS_DIR: "/data/uploads"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET}"
    volumes:
      - upload-data:/data/uploads
    depends_on:
      - nats
      - redis
    restart: unless-stopped
    networks:
      - tenxo-net

  # ─── Frontend (Next.js) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "https://api.tenxo.ai"
      NEXT_PUBLIC_WS_URL: "wss://api.tenxo.ai"
      NEXT_PUBLIC_SUPABASE_URL: "${NEXT_PUBLIC_SUPABASE_URL}"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
    depends_on:
      - matchmaker
    restart: unless-stopped
    networks:
      - tenxo-net

networks:
  tenxo-net:
    driver: bridge

volumes:
  nats-data:
  redis-data:
  upload-data:
