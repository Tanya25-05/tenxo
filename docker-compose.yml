version: "3.9"
services:
  nats:
    image: nats:2.10.3
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - /home/giyu/codes/opensource/tenxo/configs/nats.conf:/etc/nats/nats-server.conf:ro
      - /home/giyu/codes/opensource/tenxo/jetstream:/data
    command: ["-c", "/etc/nats/nats-server.conf"]
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped
