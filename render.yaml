services:
  - type: web
    name: tenxo-api
    env: docker
    repo: https://github.com/YOUR_USER/gpu-grid
    branch: main
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: API_ADDR
        value: ":8080"
      - key: PUBLIC_API_URL
        value: https://tenxo-api.onrender.com
      - key: NATS_URL
        value: nats://localhost:4222
      - key: NATS_STREAM
        value: JOB_STREAM
      - key: DATABASE_URL
        fromDatabase:
          name: tenxo-db
          property: connectionString
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false

databases:
  - name: tenxo-db
    plan: free
