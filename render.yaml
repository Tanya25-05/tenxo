services:
  # ─── Backend: Go Matchmaker ───────────────────────────────────────────────
  - type: web
    name: tenxo-api
    env: docker
    repo: https://github.com/Tanya25-05/tenxo
    branch: main
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: API_ADDR
        value: ":8080"
      - key: PUBLIC_API_URL
        value: https://tenxo-api.onrender.com
      - key: NATS_URL
        value: nats://localhost:4222
      - key: NATS_STREAM
        value: JOB_STREAM
      - key: DATABASE_URL
        fromDatabase:
          name: tenxo-db
          property: connectionString
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false

  # ─── Frontend: Next.js 14 ─────────────────────────────────────────────────
  - type: web
    name: tenxo-app
    env: node
    repo: https://github.com/Tanya25-05/tenxo
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://tenxo-api.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: wss://tenxo-api.onrender.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://cvuxfobevbarzkjfswhr.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: sb_publishable_Vbno_W45itCahi9Jk51hzA_dc-0A6QM
      - key: NEXT_PUBLIC_RAZORPAY_KEY_ID
        value: rzp_test_Su6XlqrDPdPRvZ

databases:
  - name: tenxo-db
    plan: free
